<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Acceso | Ferretería el Greco</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primary: #E79439;
            --secondary: #6C757D;
            --light: #F8F9FA;
        }

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--light);
            color: var(--secondary);
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e9ecef;
            padding: 25px 15px;
            text-align: center;
        }

        header img {
            max-width: 280px;
            height: auto;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            font-weight: 500;
            margin-bottom: 40px;
            color: #343a40;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
        }

        .card {
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #e9ecef;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.08);
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #ffffff;
        }

        .card-title {
            padding: 18px;
            text-align: center;
            font-size: 1.05rem;
            font-weight: 600;
            color: #343a40;
        }

        footer {
            text-align: center;
            padding: 30px 15px;
            font-size: 0.85rem;
            color: var(--secondary);
        }
    </style>
</head>
<body>

<header>
    <img src="https://www.ferreteriaelgreco.es/web/image/website/3/logo/Panel%20de%20acceso%20|%20Ferreter%C3%ADa%20el%20Greco?unique=789b51a"
         alt="Ferretería el Greco">
</header>

<main>
    <h1>Accesos directos</h1>

    <div class="grid">

        <!-- Amazon Hub -->
        <a class="card" href="https://hub.amazon.com/" target="_blank">
            <img src="https://www.ferreteriaelgreco.es/web/image/6455-6290cc14/fit.webp" alt="Amazon Hub">
            <div class="card-title">Amazon Hub</div>
        </a>

        <!-- Celeritas -->
        <a class="card" href="https://red.celeritastransporte.com/iniciar-sesion" target="_blank">
            <img src="https://www.ferreteriaelgreco.es/web/image/8745-955257a5/edificio-celeritas.webp" alt="Celeritas">
            <div class="card-title">Plataforma Celeritas</div>
        </a>

        <!-- POS -->
        <a class="card" href="https://www.ferreteriaelgreco.es/gl/web/login?redirect=%2Fodoo%2Fpoint-of-sale%3F" target="_blank">
            <img src="https://www.ferreteriaelgreco.es/web/image/6452-008c0098/13.webp" alt="POS">
            <div class="card-title">Punto de Venta (POS)</div>
        </a>

    </div>
</main>

<footer>
    © Ferretería el Greco
</footer>

</body>
</html>
